<!-- Служебная страница: запускает игру на виртуальных часах и записывает GIF и скриншоты для презентации.
     Порядок: powershell -File dev/receiver.ps1, затем открыть эту страницу и вызвать Scenes.* из консоли (см. dev/scenes.js). -->
<script>window.__lf = []; window.AudioContext = undefined; window.webkitAudioContext = undefined;</script>
<script src="vclock.js"></script>
<link rel="stylesheet" href="../css/game.css">
<style>
/* настоящий :hover синтетическими событиями не включить, поэтому у рекордера есть класс hov */
.blk.item.hov .mk { background: rgba(255,228,120,.95); }
.blk.item.got.hov .mk { background: rgba(255,206,52,.98); }
.dc.hov canvas { filter: brightness(1.18); }
.mug.hov > canvas:first-child { filter: brightness(1.12); }
.btn.hov { filter: brightness(1.12); }
.readpile.spread .rp.hov canvas { transform: translateY(-18px) scale(1.06); }
.fp-hbtn.hov { background: #fff0b0; }
.fcard.hov { filter: brightness(1.08); }
#clickring { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 3px solid #e2b64c; border-radius: 50%; pointer-events: none; z-index: 99997; opacity: 0; }
#clickring.go { animation: clk .35s ease-out; }
@keyframes clk { 0% { opacity: .95; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.5); } }
</style>
</head>
