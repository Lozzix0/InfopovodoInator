<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Проверка QR</title>
<style>body{font:14px monospace;background:#fff;color:#000;padding:12px}.ok{color:#080}.bad{color:#c00}</style></head>
<body><h3>Проверка генератора QR (presentation/qr.js)</h3><div id="out"></div>
<script src="../presentation/qr.js"></script>
<script>
/* Служебная страница. Проверки: (1) код Рида-Соломона на эталонном примере из учебника по QR («HELLO WORLD», версия 1-M);
   (2) константы кодов версии из стандарта; (3) обратный разбор матрицы: формат -> маска -> данные -> проверка остатка по каждому блоку -> текст. */
var out = document.getElementById('out');
function line(ok, s) { out.innerHTML += '<div class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'OK ' : 'СБОЙ ') + s + '</div>'; }

var rs = QR._rs([32, 91, 11, 120, 209, 114, 220, 77, 67, 64, 236, 17, 236, 17, 236, 17], 10).join(',');
line(rs === '196,35,39,119,235,215,231,226,93,23', 'Рид-Соломон на эталоне: ' + rs);

[[7, 0x07C94], [8, 0x085BC], [40, 0x28C69]].forEach(function (p) {
  var rem = p[0]; for (var i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
  var v = (p[0] << 12) | rem; line(v === p[1], 'код версии ' + p[0] + ': ' + v.toString(16));
});

var ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
var NB = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];
function decode(q) {
  var n = q.size, m = q.modules, ver = (n - 17) / 4;
  // карта служебных клеток строится заново по описанию стандарта
  var fn = []; for (var y = 0; y < n; y++) fn.push(new Array(n).fill(false));
  function box(x0, y0, w, h) { for (var y = y0; y < y0 + h; y++) for (var x = x0; x < x0 + w; x++) if (x >= 0 && y >= 0 && x < n && y < n) fn[y][x] = true; }
  box(0, 0, 9, 9); box(n - 8, 0, 8, 9); box(0, n - 8, 9, 8);          // три искателя с разделителями и полями формата
  for (var i = 0; i < n; i++) { fn[6][i] = true; fn[i][6] = true; }     // линии синхронизации
  if (ver >= 2) {
    var na = Math.floor(ver / 7) + 2, step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (na * 2 - 2)) * 2, pos = [6];
    for (var p = n - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
    pos.forEach(function (a, i) { pos.forEach(function (b, j) { if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) return; box(a - 2, b - 2, 5, 5); }); });
  }
  if (ver >= 7) { box(n - 11, 0, 3, 6); box(0, n - 11, 6, 3); }
  // формат: читаем вторую копию (вдоль нижнего левого и верхнего правого искателей) и сверяем с первой
  var f1 = 0, f2 = 0, k;
  var c1 = [[8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8], [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]];
  for (k = 0; k < 15; k++) if (m[c1[k][1]][c1[k][0]]) f1 |= 1 << k;
  for (k = 0; k < 8; k++) if (m[8][n - 1 - k]) f2 |= 1 << k;
  for (k = 8; k < 15; k++) if (m[n - 15 + k][8]) f2 |= 1 << k;
  if (f1 !== f2) return { err: 'копии формата не совпадают' };
  var fd = (f1 ^ 0x5412) >> 10, level = fd >> 3, mask = fd & 7;
  if (level !== 0) return { err: 'уровень не M' };
  var bitsArr = [];
  for (var right = n - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (var v = 0; v < n; v++) for (var j = 0; j < 2; j++) {
      var x = right - j, up = ((right + 1) & 2) === 0, y = up ? n - 1 - v : v;
      if (fn[y][x]) continue;
      var d = m[y][x], inv = [(x + y) % 2 === 0, y % 2 === 0, x % 3 === 0, (x + y) % 3 === 0, (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0,
        (x * y) % 2 + (x * y) % 3 === 0, ((x * y) % 2 + (x * y) % 3) % 2 === 0, (((x + y) % 2) + (x * y) % 3) % 2 === 0][mask];
      bitsArr.push(inv ? !d : d);
    }
  }
  var cw = []; for (var i2 = 0; i2 + 8 <= bitsArr.length; i2 += 8) { var b = 0; for (var t = 0; t < 8; t++) b = (b << 1) | (bitsArr[i2 + t] ? 1 : 0); cw.push(b); }
  // обратное чередование блоков и проверка остатка Рида-Соломона у каждого
  var nb = NB[ver], el = ECC[ver], total = cw.length, shortN = nb - total % nb, shortLen = Math.floor(total / nb), blocks = [], q2 = 0;
  for (var bi = 0; bi < nb; bi++) blocks.push([]);
  for (var col = 0; col <= shortLen; col++) for (var bj = 0; bj < nb; bj++) {
    if (col === shortLen - el && bj < shortN) continue;                  // у коротких блоков слов данных на одно меньше: в потоке эта клетка пропущена
    blocks[bj].push(cw[q2++]);
  }
  var dataBytes = [], allZero = true;
  blocks.forEach(function (blk, bj2) {
    var isLong = bj2 >= shortN, dl = shortLen + (isLong ? 1 : 0) - el;
    var dat = blk.slice(0, dl), ecc = blk.slice(dl), calc = QR._rs(dat, el);
    for (var z = 0; z < el; z++) if (calc[z] !== ecc[z]) allZero = false;
    dataBytes = dataBytes.concat(dat);
  });
  if (!allZero) return { err: 'остаток Рида-Соломона не сходится' };
  var bs = '', ii; dataBytes.forEach(function (bv) { bs += ('0000000' + bv.toString(2)).slice(-8); });
  if (bs.slice(0, 4) !== '0100') return { err: 'не байтовый режим' };
  var cc = ver < 10 ? 8 : 16, cnt = parseInt(bs.slice(4, 4 + cc), 2), arr = [];
  for (ii = 0; ii < cnt; ii++) arr.push(parseInt(bs.slice(4 + cc + ii * 8, 12 + cc + ii * 8), 2));
  return { text: new TextDecoder().decode(new Uint8Array(arr)) };
}

var samples = ['A', 'https://example.com/', 'https://vpi674252.github.io/infopovodoinator/', 'https://github.com/vpi674252/infopovodoinator-with-a-very-long-repository-name/tree/main',
  'Русский текст: ИнфоповодоИнатор', new Array(120).join('x'), new Array(300).join('yz'), 'https://example.com/' + new Array(400).join('a1'), new Array(2000).join('q')];
samples.forEach(function (t) {
  var c = document.createElement('canvas'), q;
  try { q = QR.draw(c, t, 4); } catch (e) { line(false, 'ошибка: ' + e.message); return; }
  var r = decode(q);
  line(r.text === t, 'версия ' + q.version + ', длина ' + t.length + (r.err ? ' — ' + r.err : ''));
});
</script></body></html>
